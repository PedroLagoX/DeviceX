spring.application.name=devicex-api

spring.datasource.url=jdbc:postgresql://localhost:5432/devicex
spring.datasource.username=postgres
spring.datasource.password=${DEVICEX_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

devicex.jwt.secret=${DEVICEX_JWT_SECRET}
devicex.jwt.expiration=3600

devicex.admin.email=${DEVICEX_ADMIN_EMAIL}
devicex.admin.password=${DEVICEX_ADMIN_PASSWORD}